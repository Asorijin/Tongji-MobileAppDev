# CI：静态检查（Ubuntu，本地同款脚本）+ iOS 构建与测试（macOS 15 / Xcode 16.4 / iOS 18.5 模拟器）
#
# 设计目标（课程约束：开销最小、构建最快、静态校验尽量本地完成）：
#   - 仅在公开仓库的免费 macOS 额度内运行；推送到 main 与 PR 时触发，同一分支的旧运行自动取消。
#   - Xcode 16.4 是 macos-15 镜像的默认版本，无需切换工具链，省去 xcode-select 的额外时间。
#   - iPhone SE (3rd generation) 是最轻量的模拟器，UI 测试串行执行。
#     镜像的 CoreSimulator 预置设备偶尔没有注册（actions/runner-images#12948），
#     因此显式用 simctl 创建该型号设备，xcodebuild 只按 UDID 选取目标。
#   - 先 build-for-testing 再 test-without-building，避免测试阶段重复编译。
#   - XcodeGen 走缓存，未命中时从 GitHub Release 下载预编译二进制（不做 SwiftPM 编译）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODEGEN_VERSION: 2.46.0
  XCODE_VERSION: "16.4"
  ACTIONLINT_VERSION: "1.7.12"
  # 模拟器运行版本；设备型号在「准备模拟器」步骤里固定为 iPhone SE 3rd gen。
  SIM_RUNTIME: "18.5"

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # ubuntu-24.04 的系统 Python 受 PEP 668（externally-managed-environment）保护，
      # 用 setup-python 提供的独立 Python，避免 --break-system-packages 或额外 venv 依赖。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyYAML
        run: python -m pip install --quiet --disable-pip-version-check pyyaml
      - name: 校验 workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      # 运行 4 的失败原因：job 名称里的 ${{ env.* }} 不合法，GitHub 在启动任何 job 前
      # 就拒绝了整个 workflow（API 里是 0 个 job），YAML 本身却能被安全解析。
      # actionlint 会做 GitHub Actions 表达式的上下文可用性检查，在本 job 内尽早拦截。
      - name: actionlint（GitHub Actions 表达式与语义检查）
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version
          /tmp/actionlint -no-color -shellcheck="" -pyflakes="" .github/workflows/ci.yml
      - name: 校验合成名片数据集（Ground Truth / 图像完整性 / 字段契约）
        run: python scripts/verify_test_cards.py
      - name: 校验 Python 脚本可解析
        run: python -m py_compile scripts/make_test_cards.py scripts/verify_test_cards.py

  build-and-test:
    # job 名称不能用 ${{ env.* }}（GitHub 只允许 github/inputs/matrix/needs/strategy/vars 上下文），
    # 否则整个 workflow 会在启动 job 前被拒绝（运行 4）。版本号变更时手改此名称。
    name: iOS 构建与测试（iPhone SE 3rd gen / iOS 18.5）
    needs: static
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # 运行 3 的失败原因：镜像 CoreSimulator 的预置设备未注册，xcodebuild 只看到
      # 「Any iOS Simulator Device」占位符（actions/runner-images#12948）。
      # 这里先用 simctl 刷新设备列表，再显式创建一台固定型号的模拟器并记录其 UDID；
      # 之后所有 xcodebuild 步骤只按 UDID 选取目标，不再依赖镜像里是否存在预置设备。
      - name: 准备模拟器（iPhone SE 3rd gen / iOS ${{ env.SIM_RUNTIME }}）
        run: |
          set -euo pipefail
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SIM_RUNTIME//./-}"
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes -j | grep -Fq "\"$RUNTIME\""; then
            echo "::error::镜像缺少 iOS ${SIM_RUNTIME} 模拟器运行版本（$RUNTIME）"
            exit 1
          fi
          UDID="$(xcrun simctl create "CamCardClone-CI" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$RUNTIME")"
          echo "创建的模拟器 UDID：$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: 缓存 XcodeGen
        id: xcodegen-cache
        uses: actions/cache@v4
        with:
          path: .tools/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-macos15

      - name: 安装 XcodeGen ${{ env.XCODEGEN_VERSION }}
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .tools && cd .tools
          curl -fsSL --retry 5 --retry-delay 2 -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q xcodegen.zip
          rm xcodegen.zip
          test -x xcodegen/bin/xcodegen

      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          export PATH="$PWD/.tools/xcodegen/bin:$PATH"
          xcodegen --version
          xcodegen generate

      - name: 编译测试（build-for-testing）
        run: |
          set -euo pipefail
          mkdir -p build
          rm -rf build/TestResults.xcresult build/AccuracyResults.xcresult
          xcodebuild build-for-testing \
            -project CamCardClone.xcodeproj \
            -scheme CamCardClone \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build.log

      - name: 运行测试（test-without-building）
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project CamCardClone.xcodeproj \
            -scheme CamCardClone \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            -skip-testing:CamCardCloneTests/VisionAccuracyTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/test.log

      # B 层（Week 3 概率性评价）：Vision 真实识别 40 张合成名片 → 解析器 → 与 Ground Truth 比对，
      # 产出 Markdown/JSON 报告。复用上一步的构建产物，只跑这一个用例，避免重复编译。
      - name: OCR 端到端准确率报告（B 层）
        if: always()
        run: |
          set -euo pipefail
          if ! ls build/DerivedData/Build/Products/*.xctestrun >/dev/null 2>&1; then
            echo "未找到 xctestrun（构建失败），跳过 B 层报告"
            exit 0
          fi
          rm -rf build/AccuracyResults.xcresult
          xcodebuild test-without-building \
            -project CamCardClone.xcodeproj \
            -scheme CamCardClone \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:CamCardCloneTests/VisionAccuracyTests \
            -resultBundlePath build/AccuracyResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/accuracy.log

      - name: 准确率摘要（写入 Step Summary）
        if: always()
        run: |
          if [ -f build/ocr-accuracy-report.md ]; then
            {
              echo "### OCR / 字段抽取端到端准确率（B 层）"
              echo ""
              awk '/^## 汇总/{flag=1;next}/^## /{flag=0}flag' build/ocr-accuracy-report.md
              echo ""
              echo "完整报告（逐张结果、错误明细、原始 OCR 文本）见工件 \`ocr-accuracy-report\`。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/accuracy.log ]; then
            grep -E "OCR-ACCURACY|error:|TEST (SUCCEEDED|FAILED)" build/accuracy.log | tail -n 20 >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: 上传准确率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-accuracy-report
          path: |
            build/ocr-accuracy-report.md
            build/ocr-accuracy-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: 测试摘要
        if: always()
        run: |
          if [ -f build/test.log ]; then
            grep -E "Test Suite '.*' (started|passed|failed)|Test Case .*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" build/test.log | tail -n 400 || true
          fi
          if [ -f build/build.log ] && grep -qE "error:|BUILD FAILED" build/build.log; then
            grep -E "error:|BUILD FAILED" build/build.log | head -n 100 || true
          fi

      - name: 失败时上传日志与测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-results
          path: |
            build/*.log
            build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
